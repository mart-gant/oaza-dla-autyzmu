services:
  - type: web
    name: oaza-dla-autyzmu
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: "Oaza dla Autyzmu"
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: oaza-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: oaza-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: oaza-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: oaza-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: oaza-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: REDIS_CLIENT
        value: phpredis
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        sync: false

databases:
  - name: oaza-db
    plan: free
    databaseName: oaza
    user: oaza
